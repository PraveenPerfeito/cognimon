apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: auth-service
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/part-of: cognimon
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: api.cognimon.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  name: http
