apiVersion: v1
kind: Secret
metadata:
  name: auth-service-secrets
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/part-of: cognimon
type: Opaque
stringData:
  AUTH_SERVICE_DATABASE_URL: postgresql+asyncpg://brainmon:change-me@postgresql:5432/brainmon_auth
  AUTH_SERVICE_JWT_SECRET: change-me-before-production-32-chars
  AUTH_SERVICE_REFRESH_TOKEN_SECRET: change-me-refresh-secret-32-chars
  AUTH_SERVICE_PASSWORD_PEPPER: change-me-password-pepper
