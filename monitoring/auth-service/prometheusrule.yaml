apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: auth-service
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/part-of: cognimon
    app.kubernetes.io/component: monitoring
spec:
  groups:
    - name: auth-service.rules
      rules:
        - alert: AuthServiceHigh5xxRate
          expr: |
            sum(rate(cognimon_auth_service_http_requests_total{status_code=~"5.."}[5m]))
            /
            clamp_min(sum(rate(cognimon_auth_service_http_requests_total[5m])), 0.001)
            > 0.05
          for: 10m
          labels:
            severity: warning
            service: auth-service
          annotations:
            summary: auth-service is serving elevated 5xx responses
            description: More than 5% of auth-service requests have been failing with 5xx responses for 10 minutes.
        - alert: AuthServicePodsUnavailable
          expr: kube_deployment_status_replicas_unavailable{deployment="auth-service"} > 0
          for: 10m
          labels:
            severity: critical
            service: auth-service
          annotations:
            summary: auth-service has unavailable pods
            description: One or more auth-service pods have been unavailable for at least 10 minutes.
