name: auth-service-ci

on:
  pull_request:
    paths:
      - ".github/workflows/auth-service-ci.yml"
      - "services/auth-service/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/auth-service-ci.yml"
      - "services/auth-service/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auth-service-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auth-service-checks:
    name: Lint And Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/auth-service

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/auth-service/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Ruff
        run: ruff check app tests

      - name: Run pytest
        run: pytest

  auth-service-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: auth-service-checks
    defaults:
      run:
        working-directory: services/auth-service

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build container image
        run: docker build -t cognimon-auth-service:${{ github.sha }} .
